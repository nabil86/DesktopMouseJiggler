plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    // Fat-jar packaging (compatible Gradle 9.x)
    id 'com.gradleup.shadow' version '8.3.6'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // JUnit Jupiter for testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    // Required by Gradle 9+ to run JUnit 5
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    // Define the main class for the application.
    applicationName='DesktopMouseJiggler'
    mainClass = 'com.atlas86.DesktopMouseJiggler.MouseJigglerMain'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'com.atlas86.DesktopMouseJiggler.MouseJigglerMain'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Ensure the generated start scripts and distributions use the fat (shadow) JAR
tasks.named('startScripts') {
    dependsOn shadowJar
}

tasks.named('installDist') {
    dependsOn shadowJar
}

tasks.named('distZip') {
    dependsOn shadowJar
}

distributions {
    main {
        contents {
            from(tasks.named('shadowJar')) {
                into 'lib'
            }
        }
    }
}
